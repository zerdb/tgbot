name: Zero Control tests

on:
  pull_request:
    paths:
      - "zero-control/**"
      - ".github/workflows/zero-control-tests.yml"
  push:
    branches:
      - main
    paths:
      - "zero-control/**"
      - ".github/workflows/zero-control-tests.yml"

permissions:
  contents: read

jobs:
  tests:
    name: Python tests (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: zero-control

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy requests keyboard

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Run regression tests
        run: python -m pytest -q tests
